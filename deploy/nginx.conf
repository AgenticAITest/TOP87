# Container-internal nginx. TLS is terminated by Traefik at the edge,
# so this only serves the built SPA on plain HTTP :80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache hard
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entrypoint
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

server {
    listen 80;
    server_name top87.id www.top87.id;
    return 301 https://top87.id$request_uri;
}

server {
    listen 443 ssl;
    server_name www.top87.id;

    ssl_certificate     /etc/letsencrypt/live/top87.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/top87.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://top87.id$request_uri;
}

server {
    listen 443 ssl;
    server_name top87.id;

    ssl_certificate     /etc/letsencrypt/live/top87.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/top87.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/top87;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

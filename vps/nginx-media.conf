server {
    listen 80;
    server_name media.top87.id;

    # Redirect HTTP → HTTPS (after certbot runs)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name media.top87.id;

    # SSL — certbot will fill these in automatically
    ssl_certificate     /etc/letsencrypt/live/media.top87.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.top87.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Serve uploaded files directly from disk (no proxy overhead)
    location /uploads/ {
        alias /var/www/media/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Proxy /api/ requests to the Node.js upload server
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large video uploads (500 MB)
        client_max_body_size 500M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }
}
